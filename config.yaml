# Muse Hospitality DM bot settings.
# Edit this file to change venues, hosts, the weekly schedule and every message the bot sends.
# Lines marked TODO are guesses. Confirm them before going live.

brand:
  name: Muse Hospitality
  timezone: America/New_York
  # Time of day (24h) the thank-you / missed-you messages go out the day after the night.
  followup_hour: 13
  # A night "ends" at this hour the next morning. Anyone confirmed but not checked in by then is a no-show.
  night_cutoff_hour: 5
  # When a promoter types a reply by hand in the Instagram app, the bot stays quiet in that chat for this long,
  # restarting with each message the promoter sends. If the girl double-texts (2 messages with no promoter reply
  # in between) and the bot can answer, the hold-off ends early and the bot picks the chat back up.
  human_takeover_minutes: 10
  # Guys' ticket links change weekly: supervisors send them by Monday morning and they go in the
  # Venues page in Muse OS ("Guys ticket link"), which the bot re-reads every 5 minutes.
  # Fallback only, used when Muse OS has no link for a venue:
  ticket_link: ""
  # Requests after late_after get "head over now, door closes at {last_entry}" instead of "get there after 11".
  # After last entry the bot asks the team to check the door instead of confirming. A venue can set its own
  # last_entry. Times after midnight belong to the night before (00:30 Friday night = 12:30am Saturday).
  late_after: "23:30"
  last_entry: "00:30"          # default guestlist closing time; set list_closes per venue (Nebula 01:30)
  # Each night at this time the team channel gets every venue's list for tonight, under that night's host.
  digest_time: "21:00"
  # Monday at this hour the team gets an alert listing venues running this week with no ticket link
  # (or, for cover-only venues like NOFLEX, no cover price).
  ticket_check_hour: 12

# Which venues Muse is running each night of the week. Nebula ran Fri/Sat in 9 of the last 10 months.
# Once Muse OS is connected, the nights on its Venues page replace this.
schedule:
  monday: []
  tuesday: []
  wednesday: []
  thursday: [public_hotel, noflex]
  friday: [noflex, nebula]
  saturday: [nyx_karaoke, nebula]
  sunday: []

# guys_policy:
#   ticket = guys are welcome but buy a ticket (the confirmation includes the link)  <- what the team usually says
#   ok / free = guys get in free, no ticket (Muse OS "Free" Guys' entry, or a night's cover entered as free/$0)
#   ratio  = guys OK if there are at least `min_girls_per_guy` girls for every guy, otherwise ask a human
#   ask    = always hand the chat to a human when guys are in the group
#   cover  = no ticket: guys pay a cover at the door (amount from the Weekly setup form in Muse OS)
# guys_at_table: one = with 2 or more guys, the confirmation adds that guys can't be at the table
#   (girls can bring them drinks); a single guy can sit with them. Leave it out where guys can sit at the table.
#   no     = girls only (hands off so the team can offer another venue)
# dress_code is one line, or one per day when it changes by night, e.g.
#   dress_code:
#     friday: All black, heels recommended
#     saturday: Dresses and heels
#     default: Heels and dresses are recommended, no sneakers or Uggs
# A dress code set for a specific night in Muse OS wins over both.
# arrive_by is used as "get there {arrive_by}". Nebula: the team tells girls to arrive at 11.
venues:
  nebula:
    name: Nebula
    aliases: [nebula]
    host: Devin
    arrive_by: at 11
    list_closes: "01:30"        # guestlist closing time; Muse OS Venues page overrides it
    dress_code: Heels or leather boots are recommended (please try to avoid sneakers or Uggs)
    guys_policy: ticket
    guys_at_table: one        # 2+ guys can't sit at the table (girls can bring them drinks); a single guy can
    pay_model: per_guest        # per_guest | per_guest_capped | flat   (for reporting)
  public_hotel:
    name: Public Hotel
    aliases: [public hotel, public, the public, public rooftop, public hotel rooftop]
    host: Devin                 # TODO: confirm host
    arrive_by: at 11
    dress_code: Heels and dresses are recommended, no sneakers or Uggs
    guys_policy: ticket
  noflex:
    name: NOFLEX
    aliases: [noflex, no flex]
    host: Devin                 # TODO: confirm host
    arrive_by: at 11
    dress_code: Heels and dresses are recommended, no sneakers or Uggs
    guys_policy: cover        # no tickets: guys pay cover at the door, amount typed each Sunday in Weekly setup
    guys_at_table: one        # 2+ guys can't sit at the table (girls can bring them drinks); a single guy can
  den_social:
    name: Den Social
    aliases: [den social, den]
    host: Devin                 # TODO: confirm host
    arrive_by: at 11
    dress_code: Heels and dresses are recommended, no sneakers or Uggs
    guys_policy: ticket
  marquee:
    name: Marquee
    aliases: [marquee]
    host: Devin                 # TODO: confirm host
    arrive_by: at 11
    dress_code: Heels and dresses are recommended, no sneakers or Uggs
    guys_policy: ask            # strict door
  nyx_karaoke:
    name: NYX Karaoke
    aliases: [nyx, nyx karaoke, karaoke]
    host: Devin                 # TODO: confirm host
    arrive_by: after 10:30      # TODO: confirm
    dress_code: Cute going-out fit, anything goes
