# Answers to the questions the team gets every night (from the DM history). The bot answers these itself.
faq:
  free: Girls are always free, and you get a table with drinks{at_venue}!
  table: Yes, girls get in free and you get a table with drinks{at_venue}!
  guys_cost: "Guys just need to grab a ticket{cover}: {ticket_link}"
  guys_cost_nolink: "Guys can come, they just need a ticket{cover}. I'll send the link once you pick a night."
  guys_cost_free: "Guys get in free{at_venue} too, they don't need a ticket."
  guys_cost_cover: "Guys just pay {cover_amount}cover at the door, they don't need a ticket."
  timing: "Try to get there {arrive_by}, the list closes at {last_entry}. Just text us when you're outside!"
  schedule: "{week}!"
  bring_friends: Ofc, bring all the girls! Everyone just needs to be 21+ with a physical ID.
  dress_code: "{dress_code}."
  age: Everyone needs to be 21+ with a physical ID.
  how_it_works: "It's super easy, just text us here when you're outside and our host will come walk you in."

# Every message the bot sends. Voice: a young, social girl texting her friends. Short, warm, casual words
# ("ofc", "yay", "love that"), no corporate phrasing, no long dashes, one question per message.
# Hearts only on the confirmation, so they don't feel automated. Hosts are first names only.
# Placeholders: {venue} {host} {arrive_by} {dress_code} {night} {party_size} {options} {next_options} {ticket_link}
messages:
  greeting: "Hi! We'd love to have you out."
  greeting_returning: "Hi! Welcome back."
  ask_night: What night are you thinking?
  # she named a venue but not a night: offer that venue's nights
  ask_night_for_venue: "We're at {venue} {venue_nights}, which night works for you?"
  # when the bot answers a question in its first message, it opens with this instead of the full greeting
  greeting_short: "Hi!"
  ask_venue: "{night} we have {options}, which one are you feeling?"
  venue_reask: "{night} we're only doing {options}, which one works for you?"
  big_group: Love a big group! Let me grab someone from the team to set it up for you
  ask_party_size: How many of you are coming, including you?
  ask_guys: Any guys coming with you?
  ask_guys_count: How many guys?
  ask_age: Is everyone 21+? They only take physical IDs at the door
  # a guest asks for a venue on a night we're not promoting there (all four lines join into one message)
  venue_off_night: "We're not at {venue} {night}."
  venue_off_next: "We'll be there {venue_nights}!"
  venue_off_alt: "{night} we have {options}."
  venue_off_week: "This week we're at {options}."
  venue_off_ask: Want to come to one of those?
  venue_off_ask_night: "Want to come {choice}?"       # used when there's only one night to offer
  venue_off_ask_venue: "Want to come to {choice} instead?"   # only one other venue to offer
  # she asks for a venue whose guestlist already closed tonight (closing times: list_closes per venue, or Muse OS)
  list_closed: "The list for {venue} {night} closed at {closes}."
  list_closed_alt: "{night} we still have {options}."
  no_venue_that_night: "We're not out {night}, but this week we're at {options}! Want to come to one of those?"
  guys_check: Let me check with the door about the guys at {venue}, I'll get right back to you
  age_check: Thank you for telling me! Let me check with the team and get back to you
  handoff: Let me grab someone from the team for that, one sec
  handoff_unsure_count: No worries! Someone from the team will check in with you once you know.
  decline: No worries! We'll invite you next time
  confirmation: >-
    You're all set for {venue} {night}! {dress_code}.
    Bring a physical ID and get there {arrive_by}. Text us when you're outside and {host} will walk you in 💕
  # Used when the venue has a confirmation message on the Venues page in Muse OS; that text follows it.
  confirmation_intro: "You're all set for {venue} {night}! 💕"
  # {cover} is that night's guys' cover from the Weekly setup form in Muse OS, e.g. " ($40)", or nothing if blank
  guys_ticket: "The guys just need to grab a ticket{cover}: {ticket_link}"
  guys_ticket_nolink: "The guys just need a ticket{cover}, I'll send you the link soon!"
  # venues with guys_policy: cover
  guys_cover: "The guys just pay a {cover} cover at the door, they don't need a ticket."
  guys_cover_unknown: The guys just pay cover at the door, they don't need a ticket.
  guys_free: Guys get in free too, they don't need a ticket.
  # venues with guys_at_table: one, when 2 or more guys are coming
  guys_no_table: "Just so you know, the guys can't sit at the table, but you can bring them drinks from it"
  confirmation_late: >-
    You're all set for {venue} {night}! {dress_code}.
    Bring a physical ID and head over now, the list closes at {last_entry}. Text us when you're outside and {host} will walk you in 💕
  late_check: Let me see if we can still get you in tonight, one sec
  arrival_ack: Yay! {host} is coming out to grab you, 2 min
  otw_ack: "Yay! Text us when you're outside and {host} will come grab you"
  already_confirmed: "You're already on the list for {venue} {night}! Text us when you're outside"
  thank_you: >-
    Thank you for coming out last night, we loved having you! This week we're at {next_options} if you want to come again
  missed_you: "We missed you last night! This week we're at {next_options}, want me to save you a spot?"
